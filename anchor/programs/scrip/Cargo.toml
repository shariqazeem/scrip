[package]
name = "webgold"
version = "0.1.0"
description = "Webgold — the rule and the record. Holds policy and receipts, never a book."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "webgold"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# init-if-needed, for `set_goal`, which is deliberately one instruction rather than an
# open/update pair. Anchor's warning is about accounts whose state must not be resettable;
# a Goal has no such state. Its balance lives in its token accounts, not in a counter on the
# account, and the owner is both a signer and part of the PDA seed — so the only person who
# can re-initialize a goal is the person whose goal it is, and doing so is what the
# instruction is for.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# token_interface, so one code path handles both the classic SPL Token program and
# Token-2022. The product's own assets straddle them: Oro GOLD is a plain SPL mint and SPYx
# is Token-2022, and a program that only speaks one of them can only pay half a mix.
anchor-spl = { version = "0.31.1", features = ["token"] }
