[package]
name = "webgold"
version = "0.1.0"
description = "Webgold — the rule and the record. Holds policy and receipts, never a book."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "webgold"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
# token_interface, so one code path handles both the classic SPL Token program and
# Token-2022. The product's own assets straddle them: Oro GOLD is a plain SPL mint and SPYx
# is Token-2022, and a program that only speaks one of them can only pay half a mix.
anchor-spl = { version = "0.31.1", features = ["token"] }
